name: performance benchmarks

# Benchmarks the metrics on synthetic cloud masks for the pull-request head
# and for its base branch (both on the same runner, in the same job) and fails
# if any benchmark got slower than `max_slowdown` times the base. The
# comparison table is written to the job's Summary tab and to the job log.
# No PR comment is posted, since the GITHUB_TOKEN of pull-requests from forks
# is not allowed to do that.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "git ref (branch, tag or sha) to compare against"
        required: false
        default: "master"
      max_slowdown:
        description: "maximum allowed head/base ratio of the median run-time"
        required: false
        default: "1.5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # single-threaded for more stable timings
  OMP_NUM_THREADS: 1
  NUMBA_NUM_THREADS: 1
  PYTHONHASHSEED: 0
  BASE_DIR: ${{ runner.temp }}/cloudmetrics-base
  RESULTS_DIR: ${{ runner.temp }}/benchmark-results
  # `inputs.*` is only set for workflow_dispatch, on pull_request the base of
  # the PR is used
  BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'master' }}
  MAX_SLOWDOWN: ${{ inputs.max_slowdown || '1.5' }}
  PYTEST_BENCHMARK_ARGS: >-
    --benchmark-only
    --benchmark-min-rounds=5
    --benchmark-warmup=on
    --benchmark-disable-gc

jobs:
  benchmark:
    name: benchmark head vs base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so that the base commit is available locally
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve base commit
        id: base
        # user-controlled values (branch names, inputs) are passed through the
        # environment rather than expanded into the script
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git rev-parse --verify --quiet "${BASE_REF}^{commit}" > /dev/null; then
            git fetch origin "${BASE_REF}"
          fi
          base_sha=$(git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" \
            || git rev-parse --verify "${BASE_REF}^{commit}")
          echo "base ref: ${BASE_REF} -> ${base_sha}"
          echo "head sha: ${GITHUB_SHA}"
          {
            echo "sha=${base_sha}"
            echo "label=\`${BASE_REF}\` @ ${base_sha}"
            if [ -n "${PR_NUMBER}" ]; then
              echo "head_label=PR #${PR_NUMBER} \`${PR_HEAD_REF}\` @ ${PR_HEAD_SHA} (merge commit ${GITHUB_SHA})"
            else
              echo "head_label=\`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA}"
            fi
          } >> "$GITHUB_OUTPUT"
          mkdir -p "${RESULTS_DIR}"

      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          # TODO: drop the numpy pin once the use of the removed `np.trapz`
          # has been replaced by `np.trapezoid` (fails with numpy>=2.4)
          pip install ".[test]" pytest-benchmark "numpy<2.4"

      - name: Check out base commit
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add --detach "${BASE_DIR}" "${BASE_SHA}"
          git -C "${BASE_DIR}" log --oneline -1

      # The base is installed into the same environment (rather than only put
      # on PYTHONPATH) because the version file `cloudmetrics/_version.py` is
      # generated by setuptools_scm at install time and does not exist in a
      # bare checkout. `--no-deps` keeps the dependencies of the head install,
      # so both sides run against identical versions of numpy, scipy, etc.
      # The benchmark code of the HEAD is used for both sides, run with the
      # `pytest` entry point (not `python -m pytest`, which would put the
      # current directory and thereby the head source tree on `sys.path`).
      - name: Benchmark base
        run: |
          pip install --no-deps --force-reinstall "${BASE_DIR}"
          pytest benchmarks ${PYTEST_BENCHMARK_ARGS} \
            --benchmark-json="${RESULTS_DIR}/base.json"

      - name: Benchmark head
        if: ${{ !cancelled() }}
        run: |
          pip install --no-deps --force-reinstall .
          pytest benchmarks ${PYTEST_BENCHMARK_ARGS} \
            --benchmark-json="${RESULTS_DIR}/head.json"

      - name: Compare head against base
        if: always()
        env:
          BASE_LABEL: ${{ steps.base.outputs.label }}
          HEAD_LABEL: ${{ steps.base.outputs.head_label }}
        run: |
          python benchmarks/compare.py \
            --base "${RESULTS_DIR}/base.json" \
            --head "${RESULTS_DIR}/head.json" \
            --max-slowdown "${MAX_SLOWDOWN}" \
            --base-label "${BASE_LABEL}" \
            --head-label "${HEAD_LABEL}" \
            --summary "${RESULTS_DIR}/summary.md"

      - name: Write job summary
        if: always()
        run: |
          if [ -f "${RESULTS_DIR}/summary.md" ]; then
            cat "${RESULTS_DIR}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Performance benchmark comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No comparison summary was produced, see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
